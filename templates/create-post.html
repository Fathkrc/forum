{{define "content"}}
<div class="create-post-page">
    <h1>Create Post</h1>
    <p class="create-post-subtitle">
        Share your thoughts with the Literary Lions community.
    </p>

    <form action="/create-post" method="post" class="post-form">
        {{if .Error}}
            <p class="error">{{.Error}}</p>
        {{end}}

        <div class="form-group">
            <label for="post-title">Title</label>
            <input
                type="text"
                id="post-title"
                name="title"
                value="{{.Title}}"
                maxlength="100"
                required
                placeholder="Give your post a title"
                required
            >
        </div>

        <div class="form-group">
            <label for="post-content">Content</label>
            <textarea
                id="post-content"
                name="content"
                rows="8"
                placeholder="What would you like to share?"
                required
            >{{.Content}}</textarea>
        </div>

        <fieldset class="category-fieldset">
            <legend>Categories</legend>

            <div class="category-options">
                {{range .Categories}}
                    <label class="category-option">
                        <input
                            type="checkbox"
                            name="categories"
                            value="{{.ID}}"
                        >
                        <span>{{.Name}}</span>
                    </label>
                {{end}}
            </div>
        </fieldset>

        <div class="post-form-actions">
            <button type="submit" class="submit-post-btn">
                Create Post
            </button>
        </div>
    </form>
</div>
{{end}}
