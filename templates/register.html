
{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <h2>Join Literary Lions 🦁</h2>
        <p class="auth-subtitle">Create an account and join the conversation.</p>

        {{if .Error}}
            <p class="error">{{.Error}}</p>
        {{end}}

        <form action="/register" method="post" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{.Email}}" placeholder="Enter your email" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   value="{{.Username}}" placeholder="Choose a username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit" class="btn btn-primary auth-button">Register</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>
{{end}}
