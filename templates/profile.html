{{define "content"}}
    <h2>{{.User.Username}}</h2>
    <p>Member since {{.User.CreatedAt.Format "Jan 02, 2006"}}</p>

    <section>
        <h3>Posts by {{.User.Username}}</h3>
        {{if .Posts}}
            {{range .Posts}}
                <article>
                    <h4><a href="/post?id={{.ID}}">{{.Title}}</a></h4>
                    <p>Likes: {{.Likes}} | Dislikes: {{.Dislikes}} | Comments: {{.CommentCount}}</p>
                </article>
            {{end}}
        {{else}}
            <p>No posts yet.</p>
        {{end}}
    </section>
{{end}}
